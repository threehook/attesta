server {
    listen 80;

    location /api/ {
        proxy_pass http://laadpalen-api:8787;
    }

    location / {
        root /usr/share/nginx/html;
        # The browser asks again before reusing a page, so a new deployment shows up on the next load.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
