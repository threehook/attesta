<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 1041" width="1110" height="1041" role="img" aria-label="Getting the credentials: the agent proves its identity to the issuer, the wallet fetches the credential with a key pair made in OpenBao">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6b5d"/></marker>
<style>
.b { fill: #ffffff; stroke: #9fb3ad; stroke-width: 1.5; }
.note { fill: #eef5f3; stroke: #9fb3ad; stroke-width: 1; }
.t { fill: #14201d; font: 600 13px Helvetica, Arial, sans-serif; text-anchor: middle; }
.l { fill: #14201d; font: 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
.nt { fill: #53635e; font: 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
.life { stroke: #9fb3ad; stroke-width: 1; stroke-dasharray: 4 4; }
.arr { stroke: #0b6b5d; stroke-width: 1.8; fill: none; }
.ret { stroke: #0b6b5d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
</style></defs>
<rect width="1110" height="1041" fill="#ffffff"/>
<line class="life" x1="135.0" y1="50" x2="135.0" y2="1031"/>
<line class="life" x1="345.0" y1="50" x2="345.0" y2="1031"/>
<line class="life" x1="555.0" y1="50" x2="555.0" y2="1031"/>
<line class="life" x1="765.0" y1="50" x2="765.0" y2="1031"/>
<line class="life" x1="975.0" y1="50" x2="975.0" y2="1031"/>
<rect class="b" x="50.0" y="12" width="170" height="40" rx="8"/>
<text class="t" x="135.0" y="36.0">SPIRE</text>
<rect class="b" x="260.0" y="12" width="170" height="40" rx="8"/>
<text class="t" x="345.0" y="36.0">CI/CD agent</text>
<rect class="b" x="470.0" y="12" width="170" height="40" rx="8"/>
<text class="t" x="555.0" y="36.0">Issuer</text>
<rect class="b" x="680.0" y="12" width="170" height="40" rx="8"/>
<text class="t" x="765.0" y="36.0">CI/CD agent wallet</text>
<rect class="b" x="890.0" y="12" width="170" height="40" rx="8"/>
<text class="t" x="975.0" y="36.0">OpenBao</text>
<text class="l" x="240.0" y="96">1. ask for its identity token</text>
<text class="l" x="240.0" y="111">(JWT-SVID)</text>
<line class="arr" x1="339.0" y1="128" x2="141.0" y2="128" marker-end="url(#ah)"/>
<text class="l" x="240.0" y="168">identity token</text>
<line class="ret" x1="141.0" y1="185" x2="339.0" y2="185" marker-end="url(#ah)"/>
<text class="l" x="450.0" y="225">2. ask for a credential,</text>
<text class="l" x="450.0" y="240">showing the identity token</text>
<line class="arr" x1="351.0" y1="257" x2="549.0" y2="257" marker-end="url(#ah)"/>
<rect class="note" x="445.3" y="285" width="219.40000000000003" height="46" rx="6"/>
<text class="nt" x="555.0" y="303">checks the identity token and</text>
<text class="nt" x="555.0" y="319">that the system is enrolled</text>
<text class="l" x="450.0" y="361">link to the credential (Workload,</text>
<text class="l" x="450.0" y="376">and Mandate if one exists)</text>
<line class="ret" x1="549.0" y1="393" x2="351.0" y2="393" marker-end="url(#ah)"/>
<text class="l" x="555.0" y="433">3. give the link to the wallet</text>
<line class="arr" x1="351.0" y1="450" x2="759.0" y2="450" marker-end="url(#ah)"/>
<text class="l" x="660.0" y="490">4. fetch the credential</text>
<line class="arr" x1="759.0" y1="507" x2="561.0" y2="507" marker-end="url(#ah)"/>
<text class="l" x="870.0" y="547">5. create a key pair</text>
<line class="arr" x1="771.0" y1="564" x2="969.0" y2="564" marker-end="url(#ah)"/>
<text class="l" x="870.0" y="604">public key (the private key</text>
<text class="l" x="870.0" y="619">stays in OpenBao)</text>
<line class="ret" x1="969.0" y1="636" x2="771.0" y2="636" marker-end="url(#ah)"/>
<text class="l" x="870.0" y="676">6. sign a proof that the</text>
<text class="l" x="870.0" y="691">wallet owns the key pair</text>
<line class="arr" x1="771.0" y1="708" x2="969.0" y2="708" marker-end="url(#ah)"/>
<text class="l" x="870.0" y="748">signature</text>
<line class="ret" x1="969.0" y1="765" x2="771.0" y2="765" marker-end="url(#ah)"/>
<text class="l" x="660.0" y="805">7. proof and public key</text>
<line class="arr" x1="759.0" y1="822" x2="561.0" y2="822" marker-end="url(#ah)"/>
<rect class="note" x="412.3" y="850" width="285.40000000000003" height="46" rx="6"/>
<text class="nt" x="555.0" y="868">checks the proof, issues the credential</text>
<text class="nt" x="555.0" y="884">with the public key inside</text>
<text class="l" x="660.0" y="926">credential</text>
<line class="ret" x1="561.0" y1="943" x2="759.0" y2="943" marker-end="url(#ah)"/>
<rect class="note" x="612.4" y="971" width="305.20000000000005" height="46" rx="6"/>
<text class="nt" x="765.0" y="989">keeps the credential and the key</text>
<text class="nt" x="765.0" y="1005">pair's name in memory, not the private key</text>
</svg>