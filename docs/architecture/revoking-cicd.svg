<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="The three steps of the CI/CD agent's task, and what revoking does on Mandaten and on Goedkeuringen">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6b5d"/></marker>
<style>
.b { fill: #ffffff; stroke: #9fb3ad; stroke-width: 1.5; }
.rev { fill: #fdf0ee; stroke: #b3382c; stroke-width: 1.8; }
.none { fill: #f3f4f4; stroke: #9aa3a0; stroke-width: 1.5; stroke-dasharray: 5 4; }
.lane { fill: #eef5f3; stroke: #c9d8d3; stroke-width: 1; }
.t { fill: #14201d; font: 600 13px Helvetica, Arial, sans-serif; text-anchor: middle; }
.h { fill: #14201d; font: 600 14px Helvetica, Arial, sans-serif; }
.l { fill: #14201d; font: 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
.nt { fill: #53635e; font: 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
.arr { stroke: #0b6b5d; stroke-width: 1.8; fill: none; }
</style></defs>
<rect width="960" height="620" fill="#ffffff"/>
<rect class="b" x="40" y="44" width="260" height="56" rx="8"/>
<text class="t" x="170.0" y="76.0">1. Run the tests</text>
<rect class="b" x="350" y="44" width="260" height="56" rx="8"/>
<text class="t" x="480.0" y="76.0">2. Deploy to staging</text>
<rect class="b" x="660" y="44" width="260" height="56" rx="8"/>
<text class="t" x="790.0" y="76.0">3. Deploy to production</text>
<line class="arr" x1="300" y1="72" x2="350" y2="72" marker-end="url(#ah)"/>
<line class="arr" x1="610" y1="72" x2="660" y2="72" marker-end="url(#ah)"/>
<text class="nt" x="170" y="122">Permitted for the agent itself.</text><text class="nt" x="170" y="138">No people needed.</text>
<text class="nt" x="480" y="122">Permitted for the agent itself.</text><text class="nt" x="480" y="138">No people needed.</text>
<text class="nt" x="790" y="122">Needs people. Two cases:</text>
<rect class="lane" x="20" y="160" width="920" height="150" rx="10"/>
<text class="h" x="40" y="186">A. A mandate covers this version (page Mandaten)</text>
<rect class="b" x="40" y="204" width="260" height="84" rx="8"/>
<text class="l" x="170.0" y="232.0">Two people approved a mandate</text>
<text class="l" x="170.0" y="250.0">for a pattern, for example</text>
<text class="l" x="170.0" y="268.0">deploy:prod:v1.4.*</text>
<rect class="b" x="350" y="204" width="260" height="84" rx="8"/>
<text class="l" x="480.0" y="232.0">Step 3 is permitted for every</text>
<text class="l" x="480.0" y="250.0">version that matches, as often</text>
<text class="l" x="480.0" y="268.0">as needed, until it ends</text>
<rect class="rev" x="660" y="204" width="260" height="84" rx="8"/>
<text class="t" x="790.0" y="223.0">REVOKE: Beëindigen</text>
<text class="l" x="790.0" y="241.0">Works at any time.</text>
<text class="l" x="790.0" y="259.0">Step 3 is denied within</text>
<text class="l" x="790.0" y="277.0">about 1 minute.</text>
<line class="arr" x1="300" y1="246" x2="350" y2="246" marker-end="url(#ah)"/>
<line class="arr" x1="610" y1="246" x2="660" y2="246" marker-end="url(#ah)"/>
<rect class="lane" x="20" y="330" width="920" height="270" rx="10"/>
<text class="h" x="40" y="356">B. No mandate covers it (page Goedkeuringen)</text>
<rect class="b" x="40" y="374" width="260" height="84" rx="8"/>
<text class="l" x="170.0" y="402">Step 3 is denied:</text>
<text class="l" x="170.0" y="420">“waiting for approval”</text>
<text class="l" x="170.0" y="438">the request waits up to 24 hours</text>
<rect class="b" x="350" y="374" width="260" height="84" rx="8"/>
<text class="l" x="480.0" y="402">Two different people</text>
<text class="l" x="480.0" y="420">approve the request</text>
<text class="l" x="480.0" y="438">(Goedkeuren)</text>
<rect class="b" x="660" y="374" width="260" height="84" rx="8"/>
<text class="l" x="790.0" y="402">The agent takes the approval:</text>
<text class="l" x="790.0" y="420">this exact version, once,</text>
<text class="l" x="790.0" y="438">valid for 15 minutes</text>
<line class="arr" x1="300" y1="416" x2="350" y2="416" marker-end="url(#ah)"/>
<line class="arr" x1="610" y1="416" x2="660" y2="416" marker-end="url(#ah)"/>
<line class="arr" x1="170" y1="458" x2="170" y2="490" marker-end="url(#ah)"/>
<line class="arr" x1="790" y1="458" x2="790" y2="490" marker-end="url(#ah)"/>
<rect class="rev" x="40" y="490" width="260" height="84" rx="8"/>
<text class="t" x="170.0" y="509">REVOKE: Afwijzen</text>
<text class="l" x="170.0" y="527">Works only here, while</text>
<text class="l" x="170.0" y="545">the request waits.</text>
<text class="l" x="170.0" y="563">Step 3 is never permitted.</text>
<rect class="none" x="660" y="490" width="260" height="84" rx="8"/>
<text class="t" x="790.0" y="509">NO REVOKE</text>
<text class="l" x="790.0" y="527">The request has left the page.</text>
<text class="l" x="790.0" y="545">The approval ends by itself</text>
<text class="l" x="790.0" y="563">after 15 minutes.</text>
<line class="arr" x1="790" y1="100" x2="790" y2="150"/>
</svg>
