<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" width="1500" height="1060" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c55a11"/></marker></defs>
<rect width="1500" height="1060" fill="#ffffff"/>
<text x="40" y="28" font-size="16" text-anchor="start" dominant-baseline="central" fill="#333333" font-weight="bold">Presenting a credential: the employee submits a laadpaal request</text>
<line x1="120" y1="96" x2="120" y2="1030" stroke="#999" stroke-dasharray="5 4"/>
<rect x="40.0" y="50" width="160" height="46" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.3"/>
<text x="120" y="65.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">Employee</text><text x="120" y="80.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">(browser)</text>
<line x1="350" y1="96" x2="350" y2="1030" stroke="#999" stroke-dasharray="5 4"/>
<rect x="270.0" y="50" width="160" height="46" rx="9" fill="#f5f5f5" stroke="#666666" stroke-width="1.3"/>
<text x="350" y="65.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">laadpalen</text><text x="350" y="80.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">app</text>
<line x1="580" y1="96" x2="580" y2="1030" stroke="#999" stroke-dasharray="5 4"/>
<rect x="500.0" y="50" width="160" height="46" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
<text x="580" y="65.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">attesta</text><text x="580" y="80.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">(sidecar)</text>
<line x1="810" y1="96" x2="810" y2="1030" stroke="#999" stroke-dasharray="5 4"/>
<rect x="730.0" y="50" width="160" height="46" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
<text x="810" y="73.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">Wallet UI</text>
<line x1="1040" y1="96" x2="1040" y2="1030" stroke="#999" stroke-dasharray="5 4"/>
<rect x="960.0" y="50" width="160" height="46" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
<text x="1040" y="73.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">Wallet service</text>
<line x1="1280" y1="96" x2="1280" y2="1030" stroke="#999" stroke-dasharray="5 4"/>
<rect x="1200.0" y="50" width="160" height="46" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/>
<text x="1280" y="65.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">Approval gate</text><text x="1280" y="80.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">and KMS</text>
<line x1="120" y1="130" x2="350" y2="130" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="235.0" y="123" font-size="11" text-anchor="middle" fill="#222">1. submits the request for an address</text>
<line x1="350" y1="176" x2="580" y2="176" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="465.0" y="169" font-size="11" text-anchor="middle" fill="#222">2. create request (policy request_laadpaal)</text>
<line x1="580" y1="222" x2="350" y2="222" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)" stroke-dasharray="5 3"/>
<text x="465.0" y="215" font-size="11" text-anchor="middle" fill="#c55a11">3. request id and wallet link</text>
<line x1="350" y1="268" x2="120" y2="268" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)" stroke-dasharray="5 3"/>
<text x="235.0" y="261" font-size="11" text-anchor="middle" fill="#c55a11">4. send the browser to the wallet link</text>
<line x1="120" y1="314" x2="810" y2="314" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)"/>
<text x="465.0" y="307" font-size="11" text-anchor="middle" fill="#c55a11">5. opens the wallet (already signed in)</text>
<line x1="810" y1="360" x2="1040" y2="360" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="925.0" y="353" font-size="11" text-anchor="middle" fill="#222">6. resolve the request; is this app allowed?</text>
<line x1="1040" y1="406" x2="810" y2="406" stroke="#222" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 3"/>
<text x="925.0" y="399" font-size="11" text-anchor="middle" fill="#222">7. what is asked, by whom</text>
<line x1="120" y1="452" x2="810" y2="452" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="465.0" y="445" font-size="11" text-anchor="middle" fill="#222">8. confirms with the passkey (tied to this request)</text>
<line x1="810" y1="498" x2="1040" y2="498" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="925.0" y="491" font-size="11" text-anchor="middle" fill="#222">9. approval and passkey answer</text>
<line x1="1040" y1="544" x2="1280" y2="544" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1160.0" y="537" font-size="11" text-anchor="middle" fill="#222">10. check the answer, then sign</text>
<line x1="1040" y1="590" x2="580" y2="590" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="810.0" y="583" font-size="11" text-anchor="middle" fill="#222">11. the presentation: only the chosen claims</text>
<path d="M475,616 h210 l10,10 v30 h-220 z" fill="#d5e8d4" stroke="#82b366"/>
<text x="483" y="629.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">12. verifies it, applies the policy,</text><text x="483" y="643.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">remembers the decision</text>
<line x1="580" y1="682" x2="1040" y2="682" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)" stroke-dasharray="5 3"/>
<text x="810.0" y="675" font-size="11" text-anchor="middle" fill="#c55a11">13. accepted, and where to send the browser back to</text>
<line x1="1040" y1="728" x2="810" y2="728" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)" stroke-dasharray="5 3"/>
<text x="925.0" y="721" font-size="11" text-anchor="middle" fill="#c55a11">14. send the browser back</text>
<line x1="810" y1="774" x2="120" y2="774" stroke="#222" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 3"/>
<text x="465.0" y="767" font-size="11" text-anchor="middle" fill="#222">15. the browser returns to the app</text>
<line x1="350" y1="820" x2="580" y2="820" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="465.0" y="813" font-size="11" text-anchor="middle" fill="#222">16. read the outcome</text>
<line x1="580" y1="866" x2="350" y2="866" stroke="#222" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 3"/>
<text x="465.0" y="859" font-size="11" text-anchor="middle" fill="#222">17. allowed, and who (issuer and email)</text>
<path d="M250,900 h200 l10,10 v30 h-210 z" fill="#f5f5f5" stroke="#666666"/>
<text x="258" y="913.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">18. the app runs its address rules</text><text x="258" y="927.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">once and shows the result</text>
<rect x="60" y="960" width="28" height="16" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="98" y="968" font-size="11" dominant-baseline="central" fill="#333">new component</text>
<rect x="60" y="986" width="28" height="16" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="98" y="994" font-size="11" dominant-baseline="central" fill="#333">attesta</text>
<text x="520" y="984" font-size="12" text-anchor="start" dominant-baseline="central" fill="#c55a11">Orange arrows need a change in attesta or in the apps; the others work today.</text>
</svg>