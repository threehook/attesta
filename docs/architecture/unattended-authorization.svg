<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 356" width="850" height="356" role="img" aria-label="Who talks to whom: an approver and a platform proof go to the issuer, which issues credentials to the machine wallet in the job. The gate in the job asks Attesta, the machine wallet presents to Attesta, and Attesta answers the gate.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6b5d"/></marker>
    <style>
      .b { fill: #ffffff; stroke: #9fb3ad; stroke-width: 1.5; }
      .grp { fill: none; stroke: #0b6b5d; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .t { fill: #14201d; font: 600 13px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .s { fill: #53635e; font: 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .g { fill: #0b6b5d; font: 600 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .arr { stroke: #0b6b5d; stroke-width: 1.8; fill: none; }
      .dot { fill: #0b6b5d; }
      .n { fill: #ffffff; font: 700 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect width="850" height="356" fill="#ffffff"/>

  <rect class="b" x="20" y="20" width="170" height="56" rx="8"/>
  <text class="t" x="105" y="44">Approver</text><text class="s" x="105" y="62">a named person</text>

  <rect class="b" x="20" y="150" width="170" height="56" rx="8"/>
  <text class="t" x="105" y="174">Issuer</text><text class="s" x="105" y="192">checks, then issues</text>

  <rect class="b" x="20" y="280" width="170" height="56" rx="8"/>
  <text class="t" x="105" y="304">Platform proof</text><text class="s" x="105" y="322">CI token or SPIFFE SVID</text>

  <rect class="grp" x="320" y="20" width="210" height="316" rx="10"/>
  <text class="g" x="425" y="42">The system that acts, no person</text>
  <rect class="b" x="340" y="60" width="170" height="56" rx="8"/>
  <text class="t" x="425" y="84">Gate</text><text class="s" x="425" y="102">acts only on Permit</text>
  <rect class="b" x="340" y="176" width="170" height="56" rx="8"/>
  <text class="t" x="425" y="200">Machine wallet</text><text class="s" x="425" y="218">answers by itself</text>
  <rect class="b" x="340" y="262" width="170" height="56" rx="8"/>
  <text class="t" x="425" y="286">Key in a KMS</text><text class="s" x="425" y="304">signs for the wallet</text>

  <rect class="grp" x="660" y="20" width="170" height="316" rx="10"/>
  <text class="g" x="745" y="42">Attesta</text>
  <rect class="b" x="672" y="100" width="146" height="56" rx="8"/>
  <text class="t" x="745" y="124">Policy</text><text class="s" x="745" y="142">Rego decides</text>
  <rect class="b" x="672" y="200" width="146" height="70" rx="8"/>
  <text class="t" x="745" y="224">Verify</text><text class="s" x="745" y="242">signatures and</text><text class="s" x="745" y="258">revocation</text>

  <line class="arr" x1="105" y1="76" x2="105" y2="148" marker-end="url(#ah)"/>
  <line class="arr" x1="105" y1="278" x2="105" y2="208" marker-end="url(#ah)"/>
  <line class="arr" x1="190" y1="178" x2="338" y2="204" marker-end="url(#ah)"/>
  <line class="arr" x1="512" y1="84" x2="658" y2="84" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line class="arr" x1="425" y1="118" x2="425" y2="174" marker-end="url(#ah)"/>
  <line class="arr" x1="512" y1="204" x2="670" y2="235" marker-end="url(#ah)"/>
  <line class="arr" x1="745" y1="198" x2="745" y2="158" marker-end="url(#ah)"/>
  <line class="arr" x1="670" y1="128" x2="512" y2="112" marker-end="url(#ah)"/>
  <line class="arr" x1="425" y1="234" x2="425" y2="260" marker-end="url(#ah)"/>

  <g><circle class="dot" cx="105" cy="113" r="11"/><text class="n" x="105" y="117">A</text></g>
  <g><circle class="dot" cx="105" cy="243" r="11"/><text class="n" x="105" y="247">B</text></g>
  <g><circle class="dot" cx="264" cy="191" r="11"/><text class="n" x="264" y="195">C</text></g>
  <g><circle class="dot" cx="585" cy="84" r="11"/><text class="n" x="585" y="88">1</text></g>
  <g><circle class="dot" cx="425" cy="146" r="11"/><text class="n" x="425" y="150">2</text></g>
  <g><circle class="dot" cx="591" cy="219" r="11"/><text class="n" x="591" y="223">3</text></g>
  <g><circle class="dot" cx="591" cy="120" r="11"/><text class="n" x="591" y="124">4</text></g>
</svg>
