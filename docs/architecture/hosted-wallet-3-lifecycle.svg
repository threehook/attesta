<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c55a11"/></marker></defs>
<rect width="1400" height="960" fill="#ffffff"/>
<text x="40" y="28" font-size="16" text-anchor="start" dominant-baseline="central" fill="#333333" font-weight="bold">Issuance and lifecycle: joiner, mover, leaver</text>
<line x1="120" y1="96" x2="120" y2="930" stroke="#999" stroke-dasharray="5 4"/>
<rect x="40.0" y="50" width="160" height="46" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.3"/>
<text x="120" y="65.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">Employee</text><text x="120" y="80.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">(browser)</text>
<line x1="410" y1="96" x2="410" y2="930" stroke="#999" stroke-dasharray="5 4"/>
<rect x="330.0" y="50" width="160" height="46" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
<text x="410" y="65.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">Wallet</text><text x="410" y="80.5" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">(UI and service)</text>
<line x1="700" y1="96" x2="700" y2="930" stroke="#999" stroke-dasharray="5 4"/>
<rect x="620.0" y="50" width="160" height="46" rx="9" fill="#f5f5f5" stroke="#666666" stroke-width="1.3"/>
<text x="700" y="73.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">Issuer</text>
<line x1="960" y1="96" x2="960" y2="930" stroke="#999" stroke-dasharray="5 4"/>
<rect x="880.0" y="50" width="160" height="46" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/>
<text x="960" y="73.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">Identity provider</text>
<line x1="1230" y1="96" x2="1230" y2="930" stroke="#999" stroke-dasharray="5 4"/>
<rect x="1150.0" y="50" width="160" height="46" rx="9" fill="#f5f5f5" stroke="#666666" stroke-width="1.3"/>
<text x="1230" y="73.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="bold">HR system</text>
<rect x="30" y="118" width="1340" height="26" fill="#333"/>
<text x="40" y="131.0" font-size="12" text-anchor="start" dominant-baseline="central" fill="#fff" font-weight="bold">A. Joiner: the first credential</text>
<line x1="1230" y1="175" x2="700" y2="175" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="965.0" y="168" font-size="11" text-anchor="middle" fill="#222">1. new employee: department, diploma</text>
<line x1="120" y1="221" x2="410" y2="221" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="265.0" y="214" font-size="11" text-anchor="middle" fill="#222">2. opens the wallet, signs in with SSO</text>
<line x1="410" y1="267" x2="700" y2="267" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)"/>
<text x="555.0" y="260" font-size="11" text-anchor="middle" fill="#c55a11">3. asks for the employee&#x27;s credential (OpenID4VCI)</text>
<line x1="700" y1="313" x2="960" y2="313" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="830.0" y="306" font-size="11" text-anchor="middle" fill="#222">4. checks who is asking (the same SSO session)</text>
<line x1="700" y1="359" x2="410" y2="359" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)" stroke-dasharray="5 3"/>
<text x="555.0" y="352" font-size="11" text-anchor="middle" fill="#c55a11">5. issues it: short-lived, bound to a new key in the KMS</text>
<path d="M305,391 h240 l10,10 v34 h-250 z" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="313" y="406.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">6. stored in this employee&#x27;s tenant;</text><text x="313" y="420.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">renewed before it expires</text>
<rect x="30" y="485" width="1340" height="26" fill="#333"/>
<text x="40" y="498.0" font-size="12" text-anchor="start" dominant-baseline="central" fill="#fff" font-weight="bold">B. Mover: the department changes</text>
<line x1="1230" y1="540" x2="700" y2="540" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="965.0" y="533" font-size="11" text-anchor="middle" fill="#222">7. department changed</text>
<line x1="410" y1="586" x2="700" y2="586" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)"/>
<text x="555.0" y="579" font-size="11" text-anchor="middle" fill="#c55a11">8. renewal asks again, before the credential expires</text>
<line x1="700" y1="632" x2="410" y2="632" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)" stroke-dasharray="5 3"/>
<text x="555.0" y="625" font-size="11" text-anchor="middle" fill="#c55a11">9. new credential with the new department</text>
<path d="M305,664 h330 l10,10 v34 h-340 z" fill="#fff2cc" stroke="#d6b656"/>
<text x="313" y="679.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">10. the old one runs out within days: no revocation list</text><text x="313" y="693.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">is needed for a first version</text>
<rect x="30" y="725" width="1340" height="26" fill="#333"/>
<text x="40" y="738.0" font-size="12" text-anchor="start" dominant-baseline="central" fill="#fff" font-weight="bold">C. Leaver: the employee goes</text>
<line x1="1230" y1="780" x2="410" y2="780" stroke="#c55a11" stroke-width="1.3" marker-end="url(#c)"/>
<text x="820.0" y="773" font-size="11" text-anchor="middle" fill="#c55a11">11. employee has left</text>
<line x1="1230" y1="826" x2="700" y2="826" stroke="#222" stroke-width="1.3" marker-end="url(#a)"/>
<text x="965.0" y="819" font-size="11" text-anchor="middle" fill="#222">12. stop issuing</text>
<path d="M305,858 h290 l10,10 v34 h-300 z" fill="#fff2cc" stroke="#d6b656"/>
<text x="313" y="873.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">13. the tenant is switched off and its keys destroyed:</text><text x="313" y="887.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#222">the wallet is unusable for good</text>
<text x="40" y="940" font-size="12" text-anchor="start" dominant-baseline="central" fill="#c55a11">Orange arrows need a change: the issuer and the wallet do not speak this authenticated flow today (the demo issuer uses a pre-authorized offer link).</text>
</svg>