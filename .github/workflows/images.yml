name: images

on:
  pull_request:
    paths: ['backend/**', 'wallet/**', 'examples/cicd-agent/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/images.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'wallet/**', 'examples/cicd-agent/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/images.yml']

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: attesta-backend
            context: backend
            file: backend/Dockerfile
          - image: cicd-wallet
            context: .
            file: wallet/Dockerfile
          - image: cicd-agent
            context: examples/cicd-agent
            file: examples/cicd-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # A pull request only builds; the push to the registry happens after the merge.
      - uses: azure/login@v2
        if: github.event_name == 'push'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Registry
        id: acr
        if: github.event_name == 'push'
        run: |
          name=$(az acr list --resource-group rg-attesta-test --query '[0].name' -o tsv)
          az acr login --name "$name"
          echo "server=$name.azurecr.io" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.acr.outputs.server || 'local' }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
