apiVersion: apps/v1
kind: Deployment
metadata:
  name: zk-puoi-backend
  namespace: zk-puoi
  labels:
    app: zk-puoi-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zk-puoi-backend
  template:
    metadata:
      labels:
        app: zk-puoi-backend
    spec:
      containers:
        - name: zk-puoi-backend
          image: zk-puoi-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ZKPUOI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zk-puoi-backend
                  key: jwt-secret
            - name: ZKPUOI_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zk-puoi-backend
                  key: admin-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
