apiVersion: apps/v1
kind: Deployment
metadata:
  name: attesta-backend
  namespace: attesta
  labels:
    app: attesta-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attesta-backend
  template:
    metadata:
      labels:
        app: attesta-backend
    spec:
      # Kubernetes would otherwise inject variables such as ATTESTA_ISSUER_PORT=tcp://10.0.0.1:4000 for every Service in the namespace, which can
      # collide with our own settings of the same name.
      enableServiceLinks: false
      # The image runs as uid 10001; fsGroup makes the decision log volume writable for it.
      securityContext:
        fsGroup: 10001
      containers:
        - name: attesta-backend
          image: attesta-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # The address wallets reach the backend at.
            - name: ATTESTA_PUBLIC_URL
              value: http://localhost:4173
            - name: ATTESTA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: attesta-backend
                  key: admin-token
            # Authorization Decision Log: one record per decision, to an fsynced file on the decision-log volume (the durable trail), to stdout and over OTLP to Alloy.
            - name: ATTESTA_ADL_OUTPUT
              value: "file,stdout,otlp"
            - name: ATTESTA_ADL_FILE
              value: /var/lib/attesta/adl/decisions.jsonl
            - name: ATTESTA_ADL_OTLP_ENDPOINT
              value: alloy.observability.svc.cluster.local:4317
            - name: ATTESTA_ADL_OTLP_INSECURE
              value: "true"
            # Revocation: status lists are read from the issuer only. The issuer's public name resolves to 127.0.0.1 inside the cluster, so it is reached at its Service.
            - name: ATTESTA_STATUS_URL_PREFIXES
              value: https://issuer.attesta.corbencreatives.nl/status/
            - name: ATTESTA_STATUS_HOSTS
              value: https://issuer.attesta.corbencreatives.nl=http://attesta-issuer-api:4001
            # The backend loads every *.gno file here and reloads it when the ConfigMap changes: no restart (make k8s-policies).
            - name: ATTESTA_POLICIES_DIR
              value: /policies
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: decision-log
              mountPath: /var/lib/attesta/adl
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: decision-log
          persistentVolumeClaim:
            claimName: attesta-decision-log
        - name: policies
          configMap:
            name: attesta-policies
            optional: true
