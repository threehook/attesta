apiVersion: apps/v1
kind: Deployment
metadata:
  name: attesta-backend
  namespace: attesta
  labels:
    app: attesta-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attesta-backend
  template:
    metadata:
      labels:
        app: attesta-backend
    spec:
      # Kubernetes would otherwise inject variables such as ATTESTA_ISSUER_PORT=tcp://10.0.0.1:4000 for every Service in the namespace, which can
      # collide with our own settings of the same name.
      enableServiceLinks: false
      containers:
        - name: attesta-backend
          image: attesta-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Wallets on the host reach the backend through the GUI's LoadBalancer, whose nginx proxies /v1/ here.
            - name: ATTESTA_PUBLIC_URL
              value: http://localhost:4173
            - name: ATTESTA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: attesta-backend
                  key: admin-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
