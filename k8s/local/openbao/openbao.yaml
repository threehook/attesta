# OpenBao in dev mode as the local KMS: one pod, memory only, so its keys are gone when it restarts. `make openbao` sets it up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: attesta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      enableServiceLinks: false
      containers:
        - name: openbao
          image: openbao/openbao:2.4.4
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: openbao-root
                  key: token
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: attesta
spec:
  selector:
    app: openbao
  ports:
    - port: 8200
      targetPort: 8200
