# The login server sends mail here; only pods in the namespace reach it.
apiVersion: v1
kind: Service
metadata:
  name: issuer-mailpit
  namespace: attesta
spec:
  selector:
    app: issuer-mailpit
  ports:
    - port: 1025
      targetPort: 1025
---
# LoadBalancer: Docker Desktop auto-forwards this to localhost:8025, where the mails can be read.
apiVersion: v1
kind: Service
metadata:
  name: issuer-mailpit-ui
  namespace: attesta
spec:
  selector:
    app: issuer-mailpit
  ports:
    - port: 8025
      targetPort: 8025
  type: LoadBalancer
