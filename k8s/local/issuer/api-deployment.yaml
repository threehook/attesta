apiVersion: apps/v1
kind: Deployment
metadata:
  name: attesta-issuer-api
  namespace: attesta
  labels:
    app: attesta-issuer-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attesta-issuer-api
  template:
    metadata:
      labels:
        app: attesta-issuer-api
    spec:
      # Kubernetes would otherwise inject variables such as ATTESTA_ISSUER_PORT=tcp://10.0.0.1:4001 for every Service in the namespace, which can
      # collide with our own settings of the same name.
      enableServiceLinks: false
      containers:
        - name: attesta-issuer-api
          image: attesta-issuer-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          # Where the mail with the QR code goes: the mail server's settings are in this Secret (make k8s-issuer-mail). By default it is the mail catcher.
          envFrom:
            - secretRef:
                name: attesta-issuer-smtp
          env:
            # Wallets reach the issuer through the https Ingress (k8s/local/ingress); this address is written into the QR codes and the issuer metadata.
            - name: ATTESTA_ISSUER_PUBLIC_URL
              value: https://issuer.attesta.corbencreatives.nl
            - name: ATTESTA_ISSUER_DB_HOST
              value: issuer-postgres:5432
            - name: ATTESTA_ISSUER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: attesta-issuer-db
                  key: user
            - name: ATTESTA_ISSUER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attesta-issuer-db
                  key: password
          readinessProbe:
            httpGet:
              path: /info
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /info
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
