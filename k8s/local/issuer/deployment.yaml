apiVersion: apps/v1
kind: Deployment
metadata:
  name: attesta-issuer
  namespace: attesta
  labels:
    app: attesta-issuer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attesta-issuer
  template:
    metadata:
      labels:
        app: attesta-issuer
    spec:
      containers:
        - name: attesta-issuer
          image: attesta-issuer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            # Wallets on the host reach the issuer through the LoadBalancer on localhost:4000; this address is written into every offer.
            - name: ATTESTA_ISSUER_PUBLIC_URL
              value: http://localhost:4000
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
