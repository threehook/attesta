# The page's nginx reaches the app backend here; nothing else needs to.
apiVersion: v1
kind: Service
metadata:
  name: laadpalen-api
  namespace: attesta
spec:
  selector:
    app: laadpalen-api
  ports:
    - port: 8787
      targetPort: 8787
---
# How a wallet reaches attesta: through the https Ingress (k8s/local/ingress), which routes api.attesta.corbencreatives.nl here. The LoadBalancer is a
# plain-http convenience on localhost:4175 for a dev wallet; ATTESTA_PUBLIC_URL in the deployment is the https name, so links point there.
apiVersion: v1
kind: Service
metadata:
  name: laadpalen-attesta
  namespace: attesta
spec:
  selector:
    app: laadpalen-api
  ports:
    - port: 4175
      targetPort: 8080
  type: LoadBalancer
