apiVersion: apps/v1
kind: Deployment
metadata:
  name: attesta-gui
  namespace: attesta
  labels:
    app: attesta-gui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attesta-gui
  template:
    metadata:
      labels:
        app: attesta-gui
    spec:
      containers:
        - name: attesta-gui
          image: attesta-gui:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
